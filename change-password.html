<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="utils.js"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>Set Your Password</h1>
                <p>You must set a new password before continuing</p>
            </div>

            <div class="login-content">
                <div id="alertContainer"></div>

                <form id="changePasswordForm">
                    <div class="form-group">
                        <label class="form-label" for="newPassword">New Password</label>
                        <input
                            type="password"
                            id="newPassword"
                            class="form-input"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            placeholder="At least 6 characters"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            placeholder="Confirm your new password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; margin-top: 8px;">
                        <span id="submitText">Set Password</span>
                        <div class="spinner loading-spinner-inline" id="submitSpinner" style="display: none;"></div>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient(
            "https://lfydtctndrzzdyavmlva.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeWR0Y3RuZHJ6emR5YXZtbHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0Nzc5MTksImV4cCI6MjA4MzA1MzkxOX0.O7dL6Gl-Re1yKEixO_BRa-goj67os6riy15hRIE4nqY"
        );

        // Verify user is logged in
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
            }
        });

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitText.style.display = 'none';
            submitSpinner.style.display = 'block';

            try {
                // Update password in Supabase Auth
                const { error: updateError } = await db.auth.updateUser({
                    password: newPassword
                });

                if (updateError) throw updateError;

                // Get current user ID
                const { data: { session } } = await db.auth.getSession();
                if (!session) throw new Error('Session expired');

                // Clear the must_change_password flag
                const { error: roleError } = await db
                    .from('user_roles')
                    .update({ must_change_password: false })
                    .eq('user_id', session.user.id);

                if (roleError) throw roleError;

                showAlert('Password updated successfully! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } catch (error) {
                console.error('Password change error:', error);
                showAlert('Error: ' + error.message, 'error');

                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
