<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="utils.js"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>Reset Password</h1>
                <p id="pageSubtitle">Verifying your reset link...</p>
            </div>

            <div class="login-content">
                <div id="alertContainer"></div>

                <!-- Loading state (shown while verifying token) -->
                <div id="loadingState" style="text-align: center; padding: 20px;">
                    <div class="spinner" style="margin: 0 auto;"></div>
                </div>

                <!-- Reset form (hidden until token verified) -->
                <form id="resetPasswordForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="newPassword">New Password</label>
                        <input
                            type="password"
                            id="newPassword"
                            class="form-input"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            placeholder="At least 6 characters"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            placeholder="Confirm your new password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; margin-top: 8px;">
                        <span id="submitText">Reset Password</span>
                        <div class="spinner loading-spinner-inline" id="submitSpinner" style="display: none;"></div>
                    </button>
                </form>

                <!-- Error state -->
                <div id="errorState" style="display: none; text-align: center; padding: 20px;">
                    <p style="color: var(--text-muted); margin-bottom: 16px;">This reset link is invalid or has expired.</p>
                    <a href="forgot-password.html" class="btn btn-primary" style="display: inline-block;">Request New Reset Link</a>
                </div>

                <div class="login-footer">
                    <a href="index.html">Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient(
            "https://lfydtctndrzzdyavmlva.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeWR0Y3RuZHJ6emR5YXZtbHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0Nzc5MTksImV4cCI6MjA4MzA1MzkxOX0.O7dL6Gl-Re1yKEixO_BRa-goj67os6riy15hRIE4nqY"
        );

        let recoveryReady = false;

        // Listen for the PASSWORD_RECOVERY event from Supabase
        db.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                recoveryReady = true;
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('resetPasswordForm').style.display = 'block';
                document.getElementById('pageSubtitle').textContent = 'Enter your new password below';
            }
        });

        // Timeout — if no recovery event after 3 seconds, show error
        setTimeout(() => {
            if (!recoveryReady) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('pageSubtitle').textContent = 'Reset link error';
            }
        }, 3000);

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitText.style.display = 'none';
            submitSpinner.style.display = 'block';

            try {
                const { error: updateError } = await db.auth.updateUser({
                    password: newPassword
                });

                if (updateError) throw updateError;

                // Also clear must_change_password flag if set
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    await db
                        .from('user_roles')
                        .update({ must_change_password: false })
                        .eq('user_id', session.user.id);
                }

                showAlert('Password reset successfully! Redirecting to login...', 'success');

                // Sign out and redirect to login
                await db.auth.signOut();
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                console.error('Password reset error:', error);
                showAlert('Error: ' + error.message, 'error');

                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
