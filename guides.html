<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guides — Stock Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <script>(function(){var T=['ocean','forest','sunset','slate','cherry','lavender','teal','sand','midnight','nord','indigo'];var t=localStorage.getItem('theme');if(T.indexOf(t)<0){t='ocean';localStorage.setItem('theme',t);}var m=localStorage.getItem('mode');if(m!=='dark'&&m!=='light'){m='dark';localStorage.setItem('mode',m);}var d=localStorage.getItem('density')||'comfortable';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-mode',m);document.documentElement.setAttribute('data-density',d);})();</script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <script src="icons.js"></script>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="utils.js"></script>
    <script src="markdown.js"></script>
    <style>
        /* Card header — mirrors analytics.html / planner.html, which each carry
           their own copy because styles.css only defines .widget-card-new .card-head */
        .card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
        .card-title { display:flex; align-items:center; gap:8px; font-size:.95rem; font-weight:700; color:var(--text-primary); }
        .card-title .ico { display:inline-flex; color:var(--accent-primary); }

        /* ---- two-pane layout ---------------------------------------------- */
        .gd-layout { display:grid; grid-template-columns:290px 1fr; gap:18px; align-items:start; }
        /* Grid items default to min-width:auto, which lets a wide table stretch
           the column and scroll the whole page sideways instead of scrolling
           inside its own wrapper. min-width:0 is what allows them to shrink. */
        .gd-layout > * { min-width:0; }
        .gd-rail { position:sticky; top:12px; }
        .gd-rail-search { margin-bottom:10px; }
        .gd-tree { max-height:calc(100vh - 210px); overflow-y:auto; padding-right:4px; }

        .gd-group { margin-bottom:6px; }
        .gd-group-label {
            display:flex; align-items:center; gap:6px; width:100%;
            padding:7px 8px; border:0; background:transparent; cursor:pointer;
            font-family:inherit; font-size:.7rem; font-weight:800; letter-spacing:.09em;
            text-transform:uppercase; color:var(--text-secondary); text-align:left;
            border-radius:8px;
        }
        .gd-group-label:hover { background:var(--bg-tertiary); color:var(--text-primary); }
        .gd-caret { transition:transform .15s ease; flex-shrink:0; }
        .gd-group.collapsed .gd-caret { transform:rotate(-90deg); }
        .gd-group.collapsed .gd-group-body { display:none; }
        .gd-group-count { margin-left:auto; font-size:.68rem; font-weight:700; opacity:.65; letter-spacing:0; }

        .gd-sub-label {
            padding:6px 8px 3px 20px; font-size:.68rem; font-weight:700;
            letter-spacing:.05em; text-transform:uppercase; color:var(--text-secondary); opacity:.8;
        }
        .gd-link {
            display:block; width:100%; text-align:left; padding:7px 10px 7px 20px;
            border:0; background:transparent; border-radius:8px; cursor:pointer;
            font-family:inherit; font-size:.83rem; color:var(--text-secondary);
            border-left:2px solid transparent; line-height:1.35;
        }
        .gd-link:hover { background:var(--bg-tertiary); color:var(--text-primary); }
        .gd-link.active {
            background:var(--bg-tertiary); color:var(--text-primary);
            font-weight:650; border-left-color:var(--accent-primary);
        }
        .gd-link .gd-unpub { font-size:.66rem; font-weight:700; opacity:.7; margin-left:5px; }

        /* ---- rendered guide ----------------------------------------------- */
        .gd-doc-head { border-bottom:1px solid var(--bg-tertiary); padding-bottom:14px; margin-bottom:18px; }
        .gd-crumb { font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-primary); margin-bottom:6px; }
        .gd-doc-head h2 { margin:0; font-size:1.35rem; font-weight:700; color:var(--text-primary); }
        .gd-doc-sub { margin-top:5px; font-size:.85rem; color:var(--text-secondary); }
        .gd-doc-meta { margin-top:10px; font-size:.72rem; color:var(--text-secondary); opacity:.8; }

        .gd-body { color:var(--text-primary); font-size:.9rem; line-height:1.62; min-width:0; }
        .gd-body h3 { font-size:1.05rem; font-weight:700; margin:26px 0 10px; color:var(--text-primary); }
        .gd-body h4 { font-size:.94rem; font-weight:700; margin:20px 0 8px; color:var(--text-primary); }
        .gd-body h5 { font-size:.86rem; font-weight:700; margin:16px 0 6px; color:var(--text-secondary); }
        .gd-body p { margin:0 0 12px; }
        .gd-body ol, .gd-body ul { margin:0 0 12px; padding-left:22px; }
        .gd-body li { margin-bottom:6px; }
        .gd-body li > ul, .gd-body li > ol { margin:6px 0 0; }
        .gd-body hr { border:0; border-top:1px solid var(--bg-tertiary); margin:22px 0; }
        .gd-body code {
            font-family:'JetBrains Mono', monospace; font-size:.83em;
            background:var(--bg-tertiary); padding:1px 5px; border-radius:4px;
            word-break:break-word;
        }
        .gd-body a { color:var(--accent-primary); text-decoration:underline; text-underline-offset:2px; }
        .gd-body strong { font-weight:700; }

        .gd-table-wrap { overflow-x:auto; max-width:100%; margin:0 0 14px; }
        .gd-table { width:100%; border-collapse:collapse; font-size:.83rem; min-width:340px; }
        .gd-table th, .gd-table td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--bg-tertiary); vertical-align:top; }
        .gd-table th { font-weight:700; color:var(--text-secondary); font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }

        /* ---- warning tiers -------------------------------------------------
           The three tiers are the whole point of the source document: a tech
           scanning on a phone has to spot "this will stop the merchant
           transacting" without reading the paragraph. */
        .gd-callout { border-left:3px solid; border-radius:0 8px 8px 0; padding:11px 14px; margin:0 0 14px; background:var(--bg-tertiary); }
        .gd-callout-label { display:block; font-size:.67rem; font-weight:800; letter-spacing:.1em; margin-bottom:4px; }
        .gd-callout-body { font-size:.87rem; line-height:1.55; }
        .gd-callout.gd-critical { border-left-color:var(--error); }
        .gd-callout.gd-critical .gd-callout-label { color:var(--error); }
        .gd-callout.gd-note { border-left-color:var(--accent-primary); }
        .gd-callout.gd-note .gd-callout-label { color:var(--accent-primary); }
        .gd-callout.gd-admin { border-left-color:var(--warning); }
        .gd-callout.gd-admin .gd-callout-label { color:var(--warning); }

        .gd-li-callout { list-style:none; margin-left:-14px; }
        .gd-tier { display:inline-block; font-size:.62rem; font-weight:800; letter-spacing:.08em; padding:1px 6px; border-radius:4px; margin-right:5px; vertical-align:1px; }
        .gd-tier.gd-critical { background:var(--error); color:#fff; }
        .gd-tier.gd-note { background:var(--accent-primary); color:#fff; }
        .gd-tier.gd-admin { background:var(--warning); color:#241a00; }

        /* ---- editor -------------------------------------------------------- */
        .gd-editor-tabs { display:flex; gap:6px; margin-bottom:8px; }
        .gd-preview {
            display:none; border:1px solid var(--bg-tertiary); border-radius:10px;
            padding:14px; min-height:220px; max-height:420px; overflow-y:auto;
            background:var(--bg-primary);
        }
        #gdBodyInput { min-height:260px; font-size:.82rem; line-height:1.55; }
        .gd-modal-wide .modal-content { max-width:820px; }
        .modal-actions.split { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .modal-actions.split .grp { display:flex; gap:10px; }

        /* ---- mobile --------------------------------------------------------
           The rail becomes a collapsible drawer above the content: a sticky
           290px column has nowhere to live on a phone. */
        @media (max-width: 960px) {
            .gd-layout { grid-template-columns:1fr; gap:12px; }
            .gd-rail { position:static; }
            .gd-tree { max-height:none; }
            .gd-rail-card.collapsed .gd-tree { display:none; }
            .gd-rail-toggle { display:flex !important; }
        }
        .gd-rail-toggle { display:none; align-items:center; gap:8px; width:100%; padding:10px 12px; border:0; background:var(--bg-tertiary); border-radius:10px; cursor:pointer; font-family:inherit; font-size:.85rem; font-weight:650; color:var(--text-primary); margin-bottom:10px; }
        @media (max-width: 600px) {
            .gd-doc-head h2 { font-size:1.15rem; }
            .gd-body { font-size:.88rem; }
            .modal-actions.split { flex-direction:column-reverse; align-items:stretch; }
            .modal-actions.split .grp { flex-direction:column-reverse; }
            .modal-actions.split .grp .btn { width:100%; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading"><div class="spinner"></div></div>
    <div class="sync-status" id="syncStatus"></div>

    <div class="app">

        <!-- TOPBAR -->
        <div class="topbar fade-in">
            <button class="topbar-burger" onclick="toggleSidebar()" aria-label="Menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <div class="topbar-logo">
                <span class="topbar-logo-mark">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg>
                </span>
                <span>Stock Control</span>
            </div>
            <div class="topbar-spacer"></div>
            <div class="topbar-avatar" id="userAvatar" onclick="location.href='user.html'" style="cursor:pointer" title="My Profile">??</div>
        </div>

        <!-- PAGE HEAD -->
        <div class="page-head fade-in d1">
            <div class="page-title-group">
                <span class="page-title-mark">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
                </span>
                <div class="page-title">
                    <h1>Guides</h1>
                    <div class="page-title-sub" id="pageSubtitle">Terminal configuration procedures by client and vendor</div>
                </div>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" id="gdNewBtn" data-role="manager" style="display:none" onclick="openGuideModal(null)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    New guide
                </button>
            </div>
        </div>

        <div class="gd-layout fade-in d2">

            <!-- RAIL -->
            <div class="gd-rail">
                <div class="card gd-rail-card" id="gdRailCard">
                    <button class="gd-rail-toggle" onclick="toggleRail()" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                        <span id="gdRailToggleLabel">Browse guides</span>
                    </button>
                    <div class="gd-rail-search">
                        <input type="text" id="gdSearch" class="input" placeholder="Search guides…"
                               oninput="onSearchInput()" autocomplete="off">
                    </div>
                    <div class="gd-tree" id="gdTree"></div>
                </div>
            </div>

            <!-- DOCUMENT -->
            <div class="card" id="gdDocCard">
                <div id="gdDoc"></div>
            </div>
        </div>

    </div><!-- /.app -->

    <!-- GUIDE EDITOR (manager+) -->
    <div class="modal gd-modal-wide" id="guideModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="section-title">
                    <span class="ico">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
                    </span>
                    <span id="guideModalTitle">New guide</span>
                </div>
            </div>
            <form id="guideForm">
                <div class="field">
                    <label for="gdTitleInput">Title <span class="req">*</span></label>
                    <input type="text" id="gdTitleInput" class="input" required
                           placeholder="e.g. Move5000 Standalone" oninput="onTitleInput()">
                </div>

                <div class="field">
                    <label for="gdSubtitleInput">Subtitle <span class="hint">optional</span></label>
                    <input type="text" id="gdSubtitleInput" class="input"
                           placeholder="e.g. Applies to: Swaps, Installs, Upgrades">
                </div>

                <div class="field">
                    <label for="gdClientInput">Client <span class="hint">the manufacturer this sits under</span></label>
                    <select id="gdClientInput" class="select" onchange="onClientChange()"></select>
                </div>

                <div class="field">
                    <label for="gdVendorInput">Vendor <span class="hint">the bank; leave blank for a common procedure</span></label>
                    <select id="gdVendorInput" class="select"></select>
                </div>

                <div class="field">
                    <label for="gdSlugInput">Slug <span class="req">*</span> <span class="hint">used by ?guide= links between guides</span></label>
                    <input type="text" id="gdSlugInput" class="input mono" required
                           pattern="[a-z0-9][a-z0-9\-]*" placeholder="lowercase-with-hyphens">
                </div>

                <div class="field">
                    <label for="gdSortInput">Sort order <span class="hint">lower appears first within its group</span></label>
                    <input type="number" id="gdSortInput" class="input mono" value="0" step="1">
                </div>

                <div class="field">
                    <label class="toggle-label" style="display:flex;align-items:center;gap:10px;cursor:pointer">
                        <input type="checkbox" id="gdPublishedInput" checked>
                        <span>Published <span class="hint">unpublished guides stay hidden from technicians</span></span>
                    </label>
                </div>

                <div class="field">
                    <label for="gdBodyInput">Body <span class="hint">markdown — **bold**, `code`, tables, and CRITICAL / NOTE / ADMIN callouts</span></label>
                    <div class="gd-editor-tabs">
                        <button type="button" class="type-pill active" id="gdTabEdit" onclick="setEditorTab('edit')">Edit</button>
                        <button type="button" class="type-pill" id="gdTabPreview" onclick="setEditorTab('preview')">Preview</button>
                    </div>
                    <textarea id="gdBodyInput" class="textarea mono" spellcheck="false"></textarea>
                    <div class="gd-preview gd-body" id="gdPreview"></div>
                </div>

                <div class="modal-actions split">
                    <div class="grp">
                        <button type="button" class="btn btn-danger" id="gdDeleteBtn" style="display:none" onclick="deleteGuideFromModal()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                            Delete
                        </button>
                    </div>
                    <div class="grp">
                        <button type="button" class="btn btn-ghost" onclick="closeGuideModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="gdSaveBtn">Save</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isManager = false;
        let guides = [];                 // every guide the caller may read
        let guideIndex = {};             // slug -> guide
        let activeSlug = null;
        let editingGuideId = null;
        let clientNames = {};            // client_id -> display name
        let vendorNames = {};            // vendor_id -> display name
        let searchTerm = '';
        let collapsed = {};              // group key -> true when folded shut

        const GENERAL_KEY = '__general__';

        document.addEventListener('DOMContentLoaded', async () => {
            // Merchants are deliberately excluded: these are internal
            // procedures, and the guides_select RLS policy (is_staff()) returns
            // them nothing anyway.
            currentUser = await initAuth(['technician', 'manager', 'super_admin']);
            if (!currentUser) return;

            isManager = hasRole(currentUser.role, ['manager', 'super_admin']);

            initSidebar(currentUser);
            setAvatarInitials(currentUser);

            if (isManager) document.getElementById('gdNewBtn').style.display = '';

            // On a phone the rail starts folded so the guide itself is what you
            // land on, not a wall of navigation.
            if (window.matchMedia('(max-width: 960px)').matches) {
                document.getElementById('gdRailCard').classList.add('collapsed');
            }

            await loadCatalogues();
            await loadGuides();

            const params = new URLSearchParams(window.location.search);
            const wanted = params.get('guide');
            selectGuide(wanted && guideIndex[wanted] ? wanted : defaultSlug(), false);

            lucide.createIcons();
        });

        function setAvatarInitials(user) {
            const el = document.getElementById('userAvatar');
            if (el && user) el.textContent = getAvatarInitials(user);
        }

        // ---- data ----------------------------------------------------------

        async function loadCatalogues() {
            try {
                const [clients, vendors] = await Promise.all([
                    db.from('clients').select('client_id, display_name'),
                    db.from('vendors').select('vendor_id, display_name')
                ]);
                (clients.data || []).forEach(c => { clientNames[c.client_id] = c.display_name || c.client_id; });
                (vendors.data || []).forEach(v => { vendorNames[v.vendor_id] = v.display_name || v.vendor_id; });
            } catch (error) {
                // A missing display_name column (migration not yet run) must not
                // take the page down — the ids still read fine as labels.
                console.error('Catalogue load failed:', error);
            }
        }

        async function loadGuides() {
            showLoading(true);
            try {
                guides = await fetchAllRows(() => db
                    .from('guides')
                    .select('id, slug, client_id, vendor_id, title, subtitle, body_md, sort_order, is_published, updated_at')
                    .order('client_id', { ascending: true, nullsFirst: true })
                    .order('vendor_id', { ascending: true, nullsFirst: true })
                    .order('sort_order', { ascending: true }));

                guideIndex = {};
                guides.forEach(g => { guideIndex[g.slug] = g; });
            } catch (error) {
                console.error('Guide load failed:', error);
                showAlert('Could not load the guides. Please refresh.', 'error');
                guides = [];
                guideIndex = {};
            } finally {
                showLoading(false);
            }
            renderTree();
        }

        // Technicians never see unpublished guides; managers do, flagged.
        function visibleGuides() {
            return guides.filter(g => g.is_published || isManager);
        }

        function defaultSlug() {
            const list = matchingGuides();
            return list.length ? list[0].slug : null;
        }

        function clientLabel(id) {
            if (!id) return 'General';
            return clientNames[id] || id;
        }

        function vendorLabel(id) {
            return vendorNames[id] || id;
        }

        // ---- search ---------------------------------------------------------

        function onSearchInput() {
            searchTerm = document.getElementById('gdSearch').value.trim().toLowerCase();
            renderTree();
        }

        function matchingGuides() {
            const list = visibleGuides();
            if (!searchTerm) return list;
            return list.filter(g => {
                const haystack = [
                    g.title, g.subtitle, clientLabel(g.client_id),
                    g.vendor_id ? vendorLabel(g.vendor_id) : '',
                    markdownToText(g.body_md)
                ].join(' ').toLowerCase();
                return haystack.indexOf(searchTerm) !== -1;
            });
        }

        // ---- tree -----------------------------------------------------------

        function renderTree() {
            const host = document.getElementById('gdTree');
            const list = matchingGuides();

            if (!list.length) {
                host.innerHTML = '<div class="empty-state" style="padding:28px 10px">'
                    + '<p style="color:var(--text-secondary);font-size:.85rem;margin:0">'
                    + (searchTerm ? 'No guides match that search.' : 'No guides yet.')
                    + '</p></div>';
                return;
            }

            // Group by client, then vendor. A null client is the pinned General
            // group; a null vendor inside a client is its common procedures.
            const byClient = new Map();
            list.forEach(g => {
                const ck = g.client_id || GENERAL_KEY;
                if (!byClient.has(ck)) byClient.set(ck, new Map());
                const vk = g.vendor_id || '';
                const vendors = byClient.get(ck);
                if (!vendors.has(vk)) vendors.set(vk, []);
                vendors.get(vk).push(g);
            });

            const clientKeys = Array.from(byClient.keys()).sort((a, b) => {
                if (a === GENERAL_KEY) return -1;
                if (b === GENERAL_KEY) return 1;
                return clientLabel(a).localeCompare(clientLabel(b));
            });

            let html = '';
            clientKeys.forEach(ck => {
                const vendors = byClient.get(ck);
                const count = Array.from(vendors.values()).reduce((n, arr) => n + arr.length, 0);
                // A search collapses nothing — you want to see every hit.
                const isCollapsed = !searchTerm && collapsed[ck];

                html += '<div class="gd-group' + (isCollapsed ? ' collapsed' : '') + '">'
                    + '<button class="gd-group-label" type="button" onclick="toggleGroup(' + jsStr(ck) + ')">'
                    + '<svg class="gd-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'
                    + escapeHTML(ck === GENERAL_KEY ? 'General' : clientLabel(ck))
                    + '<span class="gd-group-count">' + count + '</span>'
                    + '</button><div class="gd-group-body">';

                const vendorKeys = Array.from(vendors.keys()).sort((a, b) => {
                    if (!a) return -1;             // common procedures head the client
                    if (!b) return 1;
                    return vendorLabel(a).localeCompare(vendorLabel(b));
                });

                vendorKeys.forEach(vk => {
                    if (vk) {
                        html += '<div class="gd-sub-label">' + escapeHTML(vendorLabel(vk)) + '</div>';
                    } else if (ck !== GENERAL_KEY) {
                        html += '<div class="gd-sub-label">Common procedures</div>';
                    }
                    vendors.get(vk).forEach(g => {
                        html += '<button class="gd-link' + (g.slug === activeSlug ? ' active' : '') + '" '
                            + 'type="button" onclick="selectGuide(' + jsStr(g.slug) + ')">'
                            + escapeHTML(g.title)
                            + (g.is_published ? '' : '<span class="gd-unpub">· draft</span>')
                            + '</button>';
                    });
                });

                html += '</div></div>';
            });

            host.innerHTML = html;
        }

        // Safe single-quoted JS string literal for an inline onclick attribute.
        // Order matters: escape for JS first, then for HTML. Escaping only for
        // HTML would be useless here — the parser decodes &#39; back to a quote
        // before the JS is compiled, so the value could close the string.
        function jsStr(value) {
            const js = String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return "'" + escapeHTML(js) + "'";
        }

        function toggleGroup(key) {
            collapsed[key] = !collapsed[key];
            renderTree();
        }

        function toggleRail() {
            document.getElementById('gdRailCard').classList.toggle('collapsed');
        }

        // ---- document -------------------------------------------------------

        function selectGuide(slug, pushUrl = true) {
            const guide = slug ? guideIndex[slug] : null;
            activeSlug = guide ? guide.slug : null;

            if (pushUrl) {
                const url = guide ? ('?guide=' + encodeURIComponent(guide.slug)) : window.location.pathname;
                history.pushState({ slug: activeSlug }, '', url);
            }

            renderTree();
            renderDoc(guide);

            // On a phone, picking a guide should reveal it, not leave you
            // staring at the open rail.
            if (window.matchMedia('(max-width: 960px)').matches) {
                document.getElementById('gdRailCard').classList.add('collapsed');
                document.getElementById('gdDocCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderDoc(guide) {
            const host = document.getElementById('gdDoc');

            if (!guide) {
                host.innerHTML = '<div class="empty-state" style="padding:60px 20px">'
                    + '<div class="empty-state-icon"><i data-lucide="book-open"></i></div>'
                    + '<h3 style="color:var(--text-primary);margin:14px 0 8px">No guide selected</h3>'
                    + '<p style="color:var(--text-secondary);max-width:380px;margin:0 auto">'
                    + 'Pick a guide from the list to read it.</p></div>';
                lucide.createIcons();
                return;
            }

            const crumb = [
                guide.client_id ? clientLabel(guide.client_id) : 'General',
                guide.vendor_id ? vendorLabel(guide.vendor_id) : (guide.client_id ? 'Common procedures' : null)
            ].filter(Boolean).join(' › ');

            let html = '<div class="gd-doc-head">'
                + '<div class="gd-crumb">' + escapeHTML(crumb) + '</div>'
                + '<h2>' + escapeHTML(guide.title) + '</h2>'
                + (guide.subtitle ? '<div class="gd-doc-sub">' + escapeHTML(guide.subtitle) + '</div>' : '');

            if (!guide.is_published) {
                html += '<div class="gd-doc-sub" style="color:var(--warning);font-weight:650">'
                    + 'Draft — not visible to technicians</div>';
            }

            html += '<div class="gd-doc-meta">Updated ' + escapeHTML(formatDateTime(guide.updated_at)) + '</div>';

            if (isManager) {
                html += '<div class="page-actions" style="margin-top:12px">'
                    + '<button class="btn btn-secondary btn-sm" onclick="openGuideModal(' + jsStr(guide.id) + ')">Edit</button>'
                    + '</div>';
            }

            html += '</div>';

            // renderMarkdown escapes before parsing, so body_md cannot inject markup.
            html += '<div class="gd-body">' + renderMarkdown(guide.body_md) + '</div>';

            host.innerHTML = html;
            host.scrollTop = 0;
            lucide.createIcons();
        }

        // Cross-references between guides resolve in-page instead of reloading.
        document.addEventListener('click', (e) => {
            const link = e.target.closest && e.target.closest('a.gd-xref');
            if (!link) return;
            const slug = (link.getAttribute('href') || '').replace('?guide=', '');
            if (!guideIndex[slug]) return;   // unknown target: let the browser handle it
            e.preventDefault();
            selectGuide(slug);
        });

        window.addEventListener('popstate', (e) => {
            const slug = (e.state && e.state.slug)
                || new URLSearchParams(window.location.search).get('guide');
            selectGuide(guideIndex[slug] ? slug : defaultSlug(), false);
        });

        // ---- editor ---------------------------------------------------------

        function setEditorTab(tab) {
            const editing = tab === 'edit';
            document.getElementById('gdTabEdit').classList.toggle('active', editing);
            document.getElementById('gdTabPreview').classList.toggle('active', !editing);
            document.getElementById('gdBodyInput').style.display = editing ? '' : 'none';
            document.getElementById('gdPreview').style.display = editing ? 'none' : 'block';
            if (!editing) {
                document.getElementById('gdPreview').innerHTML =
                    renderMarkdown(document.getElementById('gdBodyInput').value);
            }
        }

        function slugify(text) {
            return String(text).toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 100);
        }

        // Only auto-fill the slug while creating, and only until it is touched —
        // an existing slug is a URL other guides link to, so it must not drift.
        function onTitleInput() {
            if (editingGuideId) return;
            const slugField = document.getElementById('gdSlugInput');
            if (slugField.dataset.touched === '1') return;
            slugField.value = slugify(document.getElementById('gdTitleInput').value);
        }

        function populateClientSelect(selected) {
            const sel = document.getElementById('gdClientInput');
            const ids = Object.keys(clientNames).sort((a, b) => clientLabel(a).localeCompare(clientLabel(b)));
            sel.innerHTML = '<option value="">General — no client</option>'
                + ids.map(id => '<option value="' + escapeHTML(id) + '"'
                    + (id === selected ? ' selected' : '') + '>'
                    + escapeHTML(clientLabel(id)) + '</option>').join('');
        }

        function populateVendorSelect(selected) {
            const sel = document.getElementById('gdVendorInput');
            const hasClient = !!document.getElementById('gdClientInput').value;
            const ids = Object.keys(vendorNames).sort((a, b) => vendorLabel(a).localeCompare(vendorLabel(b)));
            sel.innerHTML = '<option value="">None — common procedure</option>'
                + ids.map(id => '<option value="' + escapeHTML(id) + '"'
                    + (id === selected ? ' selected' : '') + '>'
                    + escapeHTML(vendorLabel(id)) + '</option>').join('');
            // A vendor without a client has no branch to render on, and the DB
            // check constraint rejects it — so mirror that in the form.
            sel.disabled = !hasClient;
            if (!hasClient) sel.value = '';
        }

        function onClientChange() {
            populateVendorSelect(document.getElementById('gdVendorInput').value);
        }

        function openGuideModal(guideId) {
            if (!isManager) return;
            const guide = guideId ? guides.find(g => g.id === guideId) : null;
            editingGuideId = guide ? guide.id : null;

            document.getElementById('guideModalTitle').textContent = guide ? 'Edit guide' : 'New guide';
            document.getElementById('gdTitleInput').value = guide ? guide.title : '';
            document.getElementById('gdSubtitleInput').value = guide && guide.subtitle ? guide.subtitle : '';
            document.getElementById('gdSlugInput').value = guide ? guide.slug : '';
            document.getElementById('gdSlugInput').dataset.touched = guide ? '1' : '';
            document.getElementById('gdSortInput').value = guide ? guide.sort_order : 0;
            document.getElementById('gdPublishedInput').checked = guide ? guide.is_published : true;
            document.getElementById('gdBodyInput').value = guide ? guide.body_md : '';
            document.getElementById('gdDeleteBtn').style.display = guide ? '' : 'none';

            populateClientSelect(guide ? guide.client_id : '');
            populateVendorSelect(guide ? guide.vendor_id : '');

            setEditorTab('edit');
            document.getElementById('guideModal').classList.add('active');
            lucide.createIcons();
        }

        function closeGuideModal() {
            document.getElementById('guideModal').classList.remove('active');
            editingGuideId = null;
        }

        document.getElementById('gdSlugInput').addEventListener('input', function () {
            this.dataset.touched = '1';
        });

        document.getElementById('guideForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isManager) return;

            const title = document.getElementById('gdTitleInput').value.trim();
            const slug = document.getElementById('gdSlugInput').value.trim().toLowerCase();
            const clientId = document.getElementById('gdClientInput').value || null;
            const vendorId = document.getElementById('gdVendorInput').value || null;

            if (!title) { showAlert('A guide needs a title.', 'warning'); return; }
            if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
                showAlert('The slug must be lowercase letters, numbers and hyphens.', 'warning');
                return;
            }
            if (vendorId && !clientId) {
                showAlert('Pick a client before a vendor — a guide cannot sit under a bank alone.', 'warning');
                return;
            }

            const payload = {
                slug: slug,
                client_id: clientId,
                vendor_id: vendorId,
                title: title,
                subtitle: document.getElementById('gdSubtitleInput').value.trim() || null,
                body_md: document.getElementById('gdBodyInput').value,
                sort_order: parseInt(document.getElementById('gdSortInput').value, 10) || 0,
                is_published: document.getElementById('gdPublishedInput').checked,
                updated_by: currentUser.id
            };

            showLoading(true);
            try {
                if (editingGuideId) {
                    const { error } = await db.from('guides').update(payload).eq('id', editingGuideId);
                    if (error) throw error;
                } else {
                    const { error } = await db.from('guides').insert([payload]);
                    if (error) throw error;
                }

                closeGuideModal();
                await loadGuides();
                selectGuide(guideIndex[slug] ? slug : defaultSlug(), true);
                showAlert(editingGuideId ? 'Guide updated' : 'Guide created', 'success');
            } catch (error) {
                console.error('Guide save failed:', error);
                if (isUniqueViolation(error)) {
                    showAlert('That slug is already used by another guide.', 'error');
                } else {
                    showAlert('Could not save the guide. Please try again.', 'error');
                }
            } finally {
                showLoading(false);
            }
        });

        function deleteGuideFromModal() {
            const id = editingGuideId;
            if (!id) return;
            const guide = guides.find(g => g.id === id);
            if (!guide) return;
            if (!confirm('Delete "' + guide.title + '"? Other guides linking to it will stop resolving.')) return;

            closeGuideModal();
            deleteGuide(id);
        }

        async function deleteGuide(id) {
            showLoading(true);
            try {
                const { error } = await db.from('guides').delete().eq('id', id);
                if (error) throw error;
                await loadGuides();
                selectGuide(defaultSlug(), true);
                showAlert('Guide deleted', 'success');
            } catch (error) {
                console.error('Guide delete failed:', error);
                showAlert('Could not delete the guide.', 'error');
            } finally {
                showLoading(false);
            }
        }

        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'guideModal') closeGuideModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeGuideModal();
        });
    </script>
</body>
</html>
