<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guides — Stock Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <script>(function(){var T=['ocean','forest','sunset','slate','cherry','lavender','teal','sand','midnight','nord','indigo'];var t=localStorage.getItem('theme');if(T.indexOf(t)<0){t='ocean';localStorage.setItem('theme',t);}var m=localStorage.getItem('mode');if(m!=='dark'&&m!=='light'){m='dark';localStorage.setItem('mode',m);}var d=localStorage.getItem('density')||'comfortable';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-mode',m);document.documentElement.setAttribute('data-density',d);})();</script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <script src="icons.js"></script>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="utils.js"></script>
    <script src="markdown.js"></script>
    <style>
        /* ---- breadcrumb -----------------------------------------------------
           Sits in the page head as the subtitle, so where you are and how you get
           back are one control rather than two things saying the same thing. */
        .gd-crumbs { display:flex; align-items:center; flex-wrap:wrap; gap:2px; margin-left:-5px; }
        .gd-crumb-link { background:none; border:0; padding:2px 5px; border-radius:6px; cursor:pointer;
            font-family:inherit; font-size:inherit; color:var(--accent-primary); font-weight:600; }
        .gd-crumb-link:hover { background:var(--bg-tertiary); }
        .gd-crumb-sep { color:var(--text-secondary); opacity:.6; }
        .gd-crumb-now { padding:2px 3px; font-weight:600; }

        /* ---- drill-down cards ---------------------------------------------- */
        .gd-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
        .gd-card {
            display:flex; align-items:center; gap:12px; width:100%; text-align:left;
            padding:16px; border:1px solid var(--bg-tertiary); border-radius:12px;
            background:var(--bg-secondary); cursor:pointer; font-family:inherit;
            transition:border-color .12s ease, transform .12s ease;
        }
        .gd-card:hover { border-color:var(--accent-primary); transform:translateY(-1px); }
        /* ---- card artwork ---------------------------------------------------
           One slot shape for every level: the wordmarks, the bank marks and the
           device photos are all landscape, so a card is the same height wherever
           you are in the drill-down. */
        .gd-card-art {
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
            width:72px; height:44px; border-radius:9px; overflow:hidden;
        }
        .gd-card-art img { width:100%; height:100%; object-fit:contain; display:block; }

        /* Device photos are mostly black hardware and the bank marks are full
           colour — several dark lettering, and Hungry Jack's its own red square.
           Neither survives on a card that is dark in nine of the eleven themes,
           so both get a light stage. In light themes it reads as a faint panel
           rather than disappearing. The two are kept as separate class names
           because they mark different levels of the drill-down, even though the
           tile they ask for is currently the same. */
        .gd-art-device,
        .gd-art-brand { background:#eef1f4; padding:4px; }
        [data-mode="light"] .gd-art-device,
        [data-mode="light"] .gd-art-brand { background:#f2f4f6; }

        /* Both wordmarks are dark-on-transparent, so neither survives a dark
           theme as an <img>. Painting them through their own alpha channel with
           currentColor makes them legible in all 22 theme/mode combinations
           without a second copy of either file or a per-theme filter. */
        .gd-art-logo {
            background-color:currentColor; color:var(--text-primary);
            -webkit-mask:var(--art) center/contain no-repeat;
                    mask:var(--art) center/contain no-repeat;
        }

        /* Fallback when no artwork exists for a card — the original lettered chip.
           It takes the shape of whichever slot it is standing in, so a row that
           mixes artwork and fallbacks still has one card height. */
        .gd-art-chip {
            background:var(--bg-tertiary); color:var(--accent-primary);
            font-family:'JetBrains Mono', monospace;
            font-weight:700; font-size:.92rem; letter-spacing:.04em;
        }
        /* A device fallback is a truncated model name, not a catalogue code, so
           it keeps the UI face rather than the mono one the ids are set in. */
        .gd-art-chip.gd-art-device-chip {
            font-family:inherit; font-weight:800; font-size:.8rem; letter-spacing:.02em;
        }
        .gd-card-text { min-width:0; }
        .gd-card-name { display:block; font-weight:650; font-size:.92rem; color:var(--text-primary); }
        .gd-card-sub  { display:block; font-size:.75rem; color:var(--text-secondary); margin-top:2px; }

        /* ---- guide list (device with variants) ----------------------------- */
        .gd-list { display:flex; flex-direction:column; gap:8px; }
        .gd-row {
            display:flex; align-items:center; gap:12px; width:100%; text-align:left;
            padding:14px 16px; border:1px solid var(--bg-tertiary); border-radius:10px;
            background:var(--bg-secondary); cursor:pointer; font-family:inherit;
        }
        .gd-row:hover { border-color:var(--accent-primary); }
        .gd-row-text { min-width:0; flex:1; }
        .gd-row-name { display:block; font-weight:650; font-size:.9rem; color:var(--text-primary); }
        .gd-row-sub  { display:block; font-size:.75rem; color:var(--text-secondary); margin-top:2px; }
        .gd-chev { color:var(--text-secondary); flex-shrink:0; }
        .gd-unpub { font-size:.66rem; font-weight:700; color:var(--warning); margin-left:6px; }

        /* ---- search -------------------------------------------------------- */
        .gd-search-row { display:flex; gap:10px; margin-bottom:14px; }
        .gd-search-row .input { flex:1; }
        .gd-results { display:flex; flex-direction:column; gap:8px; }
        .gd-result-path { font-size:.72rem; color:var(--text-secondary); margin-top:2px; }

        /* ---- rendered guide ------------------------------------------------ */
        .gd-doc-head { border-bottom:1px solid var(--bg-tertiary); padding-bottom:14px; margin-bottom:18px; }
        .gd-doc-head h2 { margin:0; font-size:1.35rem; font-weight:700; color:var(--text-primary); }
        .gd-doc-sub { margin-top:5px; font-size:.85rem; color:var(--text-secondary); }
        .gd-doc-meta { margin-top:10px; font-size:.72rem; color:var(--text-secondary); opacity:.8; }

        .gd-body { color:var(--text-primary); font-size:.9rem; line-height:1.62; min-width:0; }
        .gd-body h3 { font-size:1.05rem; font-weight:700; margin:26px 0 10px; color:var(--text-primary); }
        .gd-body h4 { font-size:.94rem; font-weight:700; margin:20px 0 8px; color:var(--text-primary); }
        .gd-body h5 { font-size:.86rem; font-weight:700; margin:16px 0 6px; color:var(--text-secondary); }
        .gd-body p { margin:0 0 12px; }
        .gd-body ol, .gd-body ul { margin:0 0 12px; padding-left:22px; }
        .gd-body li { margin-bottom:6px; }
        .gd-body li > ul, .gd-body li > ol { margin:6px 0 0; }
        .gd-body hr { border:0; border-top:1px solid var(--bg-tertiary); margin:22px 0; }
        .gd-body code {
            font-family:'JetBrains Mono', monospace; font-size:.83em;
            background:var(--bg-tertiary); padding:1px 5px; border-radius:4px; word-break:break-word;
        }
        .gd-body a { color:var(--accent-primary); text-decoration:underline; text-underline-offset:2px; }
        .gd-body strong { font-weight:700; }

        .gd-table-wrap { overflow-x:auto; max-width:100%; margin:0 0 14px; }
        .gd-table { width:100%; border-collapse:collapse; font-size:.83rem; min-width:340px; }
        .gd-table th, .gd-table td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--bg-tertiary); vertical-align:top; }
        .gd-table th { font-weight:700; color:var(--text-secondary); font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }

        /* ---- warning tiers -------------------------------------------------
           The three tiers are the whole point of the source document: a tech
           scanning on a phone has to spot "this will stop the merchant
           transacting" without reading the paragraph. */
        .gd-callout { border-left:3px solid; border-radius:0 8px 8px 0; padding:11px 14px; margin:0 0 14px; background:var(--bg-tertiary); }
        .gd-callout-label { display:block; font-size:.67rem; font-weight:800; letter-spacing:.1em; margin-bottom:4px; }
        .gd-callout-body { font-size:.87rem; line-height:1.55; }
        .gd-callout.gd-critical { border-left-color:var(--error); }
        .gd-callout.gd-critical .gd-callout-label { color:var(--error); }
        .gd-callout.gd-note { border-left-color:var(--accent-primary); }
        .gd-callout.gd-note .gd-callout-label { color:var(--accent-primary); }
        .gd-callout.gd-admin { border-left-color:var(--warning); }
        .gd-callout.gd-admin .gd-callout-label { color:var(--warning); }

        .gd-li-callout { list-style:none; margin-left:-14px; }
        .gd-tier { display:inline-block; font-size:.62rem; font-weight:800; letter-spacing:.08em; padding:1px 6px; border-radius:4px; margin-right:5px; vertical-align:1px; }
        .gd-tier.gd-critical { background:var(--error); color:#fff; }
        .gd-tier.gd-note { background:var(--accent-primary); color:#fff; }
        .gd-tier.gd-admin { background:var(--warning); color:#241a00; }

        /* ---- sidebar tree (injected into the shared sidebar) ---------------- */
        #sbNavAlt .sb-back {
            width:100%; border:0; background:transparent; cursor:pointer; font-family:inherit;
            margin-bottom:6px; padding-bottom:10px; border-bottom:1px solid var(--bg-tertiary);
            justify-content:flex-start; text-align:left;
        }
        /* .sb-item .sb-label is flex:1, which combined with a button's centred
           text alignment pushes the label to the middle of the row. The label
           belongs beside the arrow, so let it size to its own content. */
        #sbNavAlt .sb-back .sb-label { flex:0 1 auto; white-space:nowrap; }
        #sbNavAlt .gd-tree-group { margin-bottom:2px; }
        #sbNavAlt .gd-tw {
            display:flex; align-items:center; gap:6px; width:100%; padding:6px 10px;
            border:0; background:transparent; cursor:pointer; border-radius:8px;
            font-family:inherit; text-align:left; color:var(--text-secondary); font-size:.8rem;
        }
        #sbNavAlt .gd-tw:hover { background:var(--bg-tertiary); color:var(--text-primary); }
        #sbNavAlt .gd-tw.lvl-client  { font-weight:750; font-size:.72rem; letter-spacing:.07em; text-transform:uppercase; }
        #sbNavAlt .gd-tw.lvl-vendor  { padding-left:22px; font-weight:650; }
        #sbNavAlt .gd-tw.lvl-device  { padding-left:36px; }
        #sbNavAlt .gd-leaf {
            display:block; width:100%; padding:5px 10px 5px 50px; border:0; background:transparent;
            cursor:pointer; border-radius:8px; font-family:inherit; text-align:left;
            color:var(--text-secondary); font-size:.79rem; line-height:1.3;
            border-left:2px solid transparent;
        }
        #sbNavAlt .gd-leaf:hover { background:var(--bg-tertiary); color:var(--text-primary); }
        #sbNavAlt .gd-leaf.active {
            background:var(--bg-tertiary); color:var(--text-primary);
            font-weight:650; border-left-color:var(--accent-primary);
        }
        #sbNavAlt .gd-caret { transition:transform .15s ease; flex-shrink:0; opacity:.7; }
        #sbNavAlt .collapsed > .gd-tw .gd-caret { transform:rotate(-90deg); }
        #sbNavAlt .collapsed > .gd-tree-body { display:none; }

        /* ---- editor -------------------------------------------------------- */
        .gd-editor-tabs { display:flex; gap:6px; margin-bottom:8px; }
        .gd-preview {
            display:none; border:1px solid var(--bg-tertiary); border-radius:10px;
            padding:14px; min-height:220px; max-height:420px; overflow-y:auto;
            background:var(--bg-primary);
        }
        #gdBodyInput { min-height:260px; font-size:.82rem; line-height:1.55; }
        .gd-modal-wide .modal-content { max-width:820px; }
        .modal-actions.split { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .modal-actions.split .grp { display:flex; gap:10px; }

        @media (max-width: 600px) {
            .gd-grid { grid-template-columns:1fr; }
            .gd-card-art { width:64px; height:40px; }
            .gd-doc-head h2 { font-size:1.15rem; }
            .gd-body { font-size:.88rem; }
            .modal-actions.split { flex-direction:column-reverse; align-items:stretch; }
            .modal-actions.split .grp { flex-direction:column-reverse; }
            .modal-actions.split .grp .btn { width:100%; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading"><div class="spinner"></div></div>
    <div class="sync-status" id="syncStatus"></div>

    <div class="app">

        <!-- TOPBAR -->
        <div class="topbar fade-in">
            <button class="topbar-burger" onclick="toggleSidebar()" aria-label="Menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <div class="topbar-logo">
                <span class="topbar-logo-mark">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg>
                </span>
                <span>Stock Control</span>
            </div>
            <div class="topbar-spacer"></div>
            <div class="topbar-avatar" id="userAvatar" onclick="location.href='user.html'" style="cursor:pointer" title="My Profile">??</div>
        </div>

        <!-- PAGE HEAD -->
        <div class="page-head fade-in d1">
            <div class="page-title-group">
                <span class="page-title-mark">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
                </span>
                <div class="page-title">
                    <h1>Guides</h1>
                    <!-- The only place the location is shown, and it is the
                         navigation: each ancestor is a button back to that level. -->
                    <div class="page-title-sub gd-crumbs" id="gdCrumbs"></div>
                </div>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" id="gdNewBtn" data-role="manager" style="display:none" onclick="openGuideModal(null)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    New guide
                </button>
            </div>
        </div>

        <div class="gd-search-row fade-in d2">
            <input type="text" id="gdSearch" class="input" placeholder="Search all guides…"
                   oninput="onSearchInput()" autocomplete="off">
        </div>

        <div class="card fade-in d3">
            <div id="gdMain"></div>
        </div>

    </div><!-- /.app -->

    <!-- GUIDE EDITOR (manager+) -->
    <div class="modal gd-modal-wide" id="guideModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="section-title">
                    <span class="ico">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
                    </span>
                    <span id="guideModalTitle">New guide</span>
                </div>
            </div>
            <form id="guideForm">
                <div class="field">
                    <label for="gdTitleInput">Title <span class="req">*</span> <span class="hint">the variant, e.g. "Standalone"</span></label>
                    <input type="text" id="gdTitleInput" class="input" required
                           placeholder="e.g. Standalone" oninput="onTitleInput()">
                </div>

                <div class="field">
                    <label for="gdSubtitleInput">Subtitle <span class="hint">optional</span></label>
                    <input type="text" id="gdSubtitleInput" class="input"
                           placeholder="e.g. Applies to: Swaps, Installs, Upgrades">
                </div>

                <div class="field">
                    <label for="gdClientInput">Client <span class="hint">the manufacturer</span></label>
                    <select id="gdClientInput" class="select" onchange="onClientChange()"></select>
                </div>

                <div class="field">
                    <label for="gdVendorInput">Vendor <span class="hint">the bank</span></label>
                    <select id="gdVendorInput" class="select" onchange="onVendorChange()"></select>
                </div>

                <div class="field">
                    <label for="gdDeviceInput">Device <span class="hint">terminal model, e.g. Move5000</span></label>
                    <input type="text" id="gdDeviceInput" class="input" list="gdDeviceList" placeholder="Move5000">
                    <datalist id="gdDeviceList"></datalist>
                </div>

                <div class="field">
                    <label for="gdSlugInput">Slug <span class="req">*</span> <span class="hint">used by ?guide= links</span></label>
                    <input type="text" id="gdSlugInput" class="input mono" required
                           pattern="[a-z0-9][a-z0-9\-]*" placeholder="lowercase-with-hyphens">
                </div>

                <div class="field">
                    <label for="gdSortInput">Sort order <span class="hint">lower appears first; also orders the devices</span></label>
                    <input type="number" id="gdSortInput" class="input mono" value="0" step="1">
                </div>

                <div class="field">
                    <label class="toggle-label" style="display:flex;align-items:center;gap:10px;cursor:pointer">
                        <input type="checkbox" id="gdPublishedInput" checked>
                        <span>Published <span class="hint">unpublished guides stay hidden from technicians</span></span>
                    </label>
                </div>

                <div class="field">
                    <label for="gdBodyInput">Body <span class="hint">markdown — **bold**, `code`, tables, and CRITICAL / NOTE / ADMIN callouts</span></label>
                    <div class="gd-editor-tabs">
                        <button type="button" class="type-pill active" id="gdTabEdit" onclick="setEditorTab('edit')">Edit</button>
                        <button type="button" class="type-pill" id="gdTabPreview" onclick="setEditorTab('preview')">Preview</button>
                    </div>
                    <textarea id="gdBodyInput" class="textarea mono" spellcheck="false"></textarea>
                    <div class="gd-preview gd-body" id="gdPreview"></div>
                </div>

                <div class="modal-actions split">
                    <div class="grp">
                        <button type="button" class="btn btn-danger" id="gdDeleteBtn" style="display:none" onclick="deleteGuideFromModal()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                            Delete
                        </button>
                    </div>
                    <div class="grp">
                        <button type="button" class="btn btn-ghost" onclick="closeGuideModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="gdSaveBtn">Save</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;
        let isManager = false;
        let guides = [];
        let guideIndex = {};          // slug -> guide
        let clientNames = {};
        let vendorNames = {};
        let editingGuideId = null;
        let searchTerm = '';
        let treeCollapsed = {};       // tree node key -> true when folded shut

        // Where we are in the drill-down. A guide slug wins over the browse path.
        let view = { client: null, vendor: null, device: null, slug: null };

        document.addEventListener('DOMContentLoaded', async () => {
            // Merchants are deliberately excluded: these are internal procedures,
            // and the guides_select RLS policy (is_staff()) returns them nothing.
            currentUser = await initAuth(['technician', 'manager', 'super_admin']);
            if (!currentUser) return;

            isManager = hasRole(currentUser.role, ['manager', 'super_admin']);

            initSidebar(currentUser);
            setAvatarInitials(currentUser);
            if (isManager) document.getElementById('gdNewBtn').style.display = '';

            // The Guides item in the app menu should bring the guides tree back
            // rather than reload the page we are already on.
            const navGuides = document.querySelector('#sidebar a[data-page="guides"]');
            if (navGuides) {
                navGuides.addEventListener('click', (e) => {
                    e.preventDefault();
                    setSidebarMode('alt');
                    closeSidebar();
                });
            }

            await loadCatalogues();
            await loadGuides();

            readUrl();
            render();
            setSidebarMode('alt');

            lucide.createIcons();
        });

        function setAvatarInitials(user) {
            const el = document.getElementById('userAvatar');
            if (el && user) el.textContent = getAvatarInitials(user);
        }

        // ---- data ----------------------------------------------------------

        async function loadCatalogues() {
            try {
                const [clients, vendors] = await Promise.all([
                    db.from('clients').select('client_id, display_name'),
                    db.from('vendors').select('vendor_id, display_name')
                ]);
                (clients.data || []).forEach(c => { clientNames[c.client_id] = c.display_name || c.client_id; });
                (vendors.data || []).forEach(v => { vendorNames[v.vendor_id] = v.display_name || v.vendor_id; });
            } catch (error) {
                // A missing display_name column must not take the page down — the
                // ids still read acceptably as labels.
                console.error('Catalogue load failed:', error);
            }
        }

        async function loadGuides() {
            showLoading(true);
            try {
                guides = await fetchAllRows(() => db
                    .from('guides')
                    .select('id, slug, client_id, vendor_id, device, title, subtitle, body_md, sort_order, is_published, updated_at')
                    .order('client_id', { ascending: true, nullsFirst: true })
                    .order('vendor_id', { ascending: true, nullsFirst: true })
                    .order('sort_order', { ascending: true }));
                guideIndex = {};
                guides.forEach(g => { guideIndex[g.slug] = g; });
            } catch (error) {
                console.error('Guide load failed:', error);
                showAlert('Could not load the guides. Please refresh.', 'error');
                guides = [];
                guideIndex = {};
            } finally {
                showLoading(false);
            }
        }

        // Technicians never see unpublished guides; managers do, flagged.
        function visibleGuides() {
            return guides.filter(g => g.is_published || isManager);
        }

        function clientLabel(id) { return clientNames[id] || id; }
        function vendorLabel(id) { return vendorNames[id] || id; }

        function generalGuides()          { return visibleGuides().filter(g => !g.client_id); }
        function clientsWithGuides()      { return uniq(visibleGuides().filter(g => g.client_id).map(g => g.client_id)); }
        function vendorsOf(client)        { return uniq(visibleGuides().filter(g => g.client_id === client && g.vendor_id).map(g => g.vendor_id)); }
        function devicesOf(client, vendor) {
            const rows = visibleGuides().filter(g => g.client_id === client && g.vendor_id === vendor && g.device);
            const order = {};
            rows.forEach(g => {
                if (order[g.device] === undefined || g.sort_order < order[g.device]) order[g.device] = g.sort_order;
            });
            return Object.keys(order).sort((a, b) => order[a] - order[b] || a.localeCompare(b));
        }
        function guidesOf(client, vendor, device) {
            return visibleGuides()
                .filter(g => g.client_id === client && g.vendor_id === vendor && g.device === device)
                .sort((a, b) => a.sort_order - b.sort_order || a.title.localeCompare(b.title));
        }

        function uniq(list) {
            return Array.from(new Set(list)).sort((a, b) => String(a).localeCompare(String(b)));
        }

        // ---- routing --------------------------------------------------------

        // Trim a path back to the deepest level that still exists, so a stale URL
        // or a just-deleted guide lands somewhere real instead of on an empty
        // level with no way out but the breadcrumb.
        function sanitiseView(v) {
            const out = { client: v.client || null, vendor: v.vendor || null, device: v.device || null, slug: v.slug || null };
            if (out.slug && !guideIndex[out.slug]) out.slug = null;
            if (out.client && clientsWithGuides().indexOf(out.client) === -1) {
                return { client: null, vendor: null, device: null, slug: null };
            }
            if (out.vendor && vendorsOf(out.client).indexOf(out.vendor) === -1) { out.vendor = null; out.device = null; }
            if (out.device && devicesOf(out.client, out.vendor).indexOf(out.device) === -1) out.device = null;
            return out;
        }

        function readUrl() {
            const p = new URLSearchParams(window.location.search);
            const slug = p.get('guide');
            if (slug && guideIndex[slug]) {
                const g = guideIndex[slug];
                view = { client: g.client_id, vendor: g.vendor_id, device: g.device, slug: g.slug };
                return;
            }
            view = sanitiseView({
                client: p.get('client'),
                vendor: p.get('vendor'),
                device: p.get('device')
            });
        }

        function urlFor(v) {
            if (v.slug) return '?guide=' + encodeURIComponent(v.slug);
            const p = new URLSearchParams();
            if (v.client) p.set('client', v.client);
            if (v.vendor) p.set('vendor', v.vendor);
            if (v.device) p.set('device', v.device);
            const q = p.toString();
            return q ? ('?' + q) : window.location.pathname;
        }

        function go(next, push = true) {
            view = next && next.slug
                ? Object.assign({ client: null, vendor: null, device: null, slug: null }, next)
                : sanitiseView(next || {});
            if (push) history.pushState(view, '', urlFor(view));
            document.getElementById('gdSearch').value = '';
            searchTerm = '';
            render();
            closeSidebar();
        }

        function openGuide(slug, push = true) {
            const g = guideIndex[slug];
            if (!g) { showAlert('That guide is no longer available.', 'warning'); return; }
            go({ client: g.client_id, vendor: g.vendor_id, device: g.device, slug: g.slug }, push);
        }

        // A device with a single guide has nothing to choose between, so open it.
        function openDevice(client, vendor, device) {
            const list = guidesOf(client, vendor, device);
            if (list.length === 1) return openGuide(list[0].slug);
            go({ client: client, vendor: vendor, device: device });
        }

        window.addEventListener('popstate', () => {
            readUrl();
            render();
        });

        // ---- render ---------------------------------------------------------

        function render() {
            renderCrumbs();
            renderMain();
            renderSidebarTree();
            bindArtFallbacks(document.getElementById('gdMain'));
            lucide.createIcons();
        }

        function renderCrumbs() {
            const host = document.getElementById('gdCrumbs');
            const parts = [];
            const atHome = !view.client && !view.slug;

            if (atHome) { host.innerHTML = '<span class="gd-crumb-now">Terminal configuration procedures</span>'; return; }

            parts.push('<button class="gd-crumb-link" type="button" onclick="go({})">Guides</button>');

            const g = view.slug ? guideIndex[view.slug] : null;
            if (g && !g.client_id) {
                parts.push('<span class="gd-crumb-sep">›</span><span class="gd-crumb-now">' + escapeHTML(g.title) + '</span>');
                host.innerHTML = parts.join('');
                return;
            }

            if (view.client) {
                const last = !view.vendor && !view.slug;
                parts.push('<span class="gd-crumb-sep">›</span>' + crumb(clientLabel(view.client), last, { client: view.client }));
            }
            if (view.vendor) {
                const last = !view.device && !view.slug;
                parts.push('<span class="gd-crumb-sep">›</span>' + crumb(vendorLabel(view.vendor), last, { client: view.client, vendor: view.vendor }));
            }
            if (view.device) {
                const last = !view.slug;
                parts.push('<span class="gd-crumb-sep">›</span>' + crumb(view.device, last, { client: view.client, vendor: view.vendor, device: view.device }));
            }
            if (view.slug && g) {
                parts.push('<span class="gd-crumb-sep">›</span><span class="gd-crumb-now">' + escapeHTML(g.title) + '</span>');
            }
            host.innerHTML = parts.join('');
        }

        function crumb(label, isLast, target) {
            if (isLast) return '<span class="gd-crumb-now">' + escapeHTML(label) + '</span>';
            return '<button class="gd-crumb-link" type="button" onclick=\'go(' + jsonAttr(target) + ')\'>'
                + escapeHTML(label) + '</button>';
        }

        function renderMain() {
            const host = document.getElementById('gdMain');

            if (searchTerm) { host.innerHTML = searchResultsHTML(); return; }
            if (view.slug)  { host.innerHTML = guideHTML(guideIndex[view.slug]); host.scrollTop = 0; return; }

            if (!view.client) {
                host.innerHTML = clientCardsHTML();
                return;
            }
            if (!view.vendor) {
                host.innerHTML = cardsHTML(vendorsOf(view.client).map(v => ({
                    label: vendorLabel(v),
                    mark: catalogueMark(v),
                    art: vendorArt(v),
                    sub: countLabel(devicesOf(view.client, v).length, 'device'),
                    target: { client: view.client, vendor: v }
                })));
                return;
            }
            if (!view.device) {
                const devices = devicesOf(view.client, view.vendor);
                host.innerHTML = '<div class="gd-grid">' + devices.map(d => {
                    const n = guidesOf(view.client, view.vendor, d).length;
                    return deviceCard(d, n);
                }).join('') + '</div>';
                return;
            }

            host.innerHTML = '<div class="gd-list">'
                + guidesOf(view.client, view.vendor, view.device).map(g => guideRow(g)).join('')
                + '</div>';
        }

        function clientCardsHTML() {
            const cards = clientsWithGuides().map(c => ({
                label: clientLabel(c),
                mark: catalogueMark(c),
                art: clientArt(c),
                sub: countLabel(vendorsOf(c).length, 'vendor'),
                target: { client: c }
            }));
            let html = cardsHTML(cards);

            const general = generalGuides();
            if (general.length) {
                html += '<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--bg-tertiary)">'
                    + general.map(g =>
                        '<button class="gd-crumb-link" type="button" style="padding:6px 0" onclick="openGuide(' + jsStr(g.slug) + ')">'
                        + escapeHTML(g.title) + '</button>').join(' · ')
                    + '</div>';
            }
            return html;
        }

        function cardsHTML(cards) {
            if (!cards.length) return emptyHTML('Nothing here yet.');
            return '<div class="gd-grid">' + cards.map(c =>
                '<button class="gd-card" type="button" onclick=\'go(' + jsonAttr(c.target) + ')\'>'
                + artHTML(c.art, c.mark)
                + '<span class="gd-card-text"><span class="gd-card-name">' + escapeHTML(c.label) + '</span>'
                + '<span class="gd-card-sub">' + escapeHTML(c.sub) + '</span></span></button>'
            ).join('') + '</div>';
        }

        /*
         * Artwork lives on disk under a naming convention rather than in a table
         * the code has to keep in step:
         *
         *   assets/logos/<client or vendor id>.svg|.webp
         *   assets/devices/<vendor>-<device>.webp   bank-specific, tried first
         *   assets/devices/<device>.webp            the generic fall-back
         *
         * The bank-specific step is what serves the Move5000: it appears under
         * four banks but the photo is CBA-branded, so move5000-cba.webp resolves
         * under CBA and everything else lands on the unbranded move5000.webp.
         *
         * A missing file is not an error — onArtError() swaps the card back to
         * its lettered chip. So dropping a bank logo into assets/logos/ makes it
         * appear with no code change, which is how the vendor cards will get
         * their logos later.
         */
        function artSlug(text) {
            return String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }

        /*
         * Manufacturer wordmarks — dark lettering on transparency. Painted
         * through a CSS mask in currentColor so they follow the theme.
         * Ingenico ships as SVG, Verifone as WebP; try both before giving up.
         */
        function clientArt(id) {
            if (!id) return null;
            const base = 'assets/logos/' + artSlug(id);
            return { kind: 'logo', srcs: [base + '.svg', base + '.webp'] };
        }

        /*
         * Bank marks. These are full-colour pictorial logos, so they render as
         * images on a light tile rather than through the mask — Hungry Jack's
         * is a solid red tile whose alpha is the whole square, and masking it
         * would give a featureless blob. Same lookup by vendor id, so dropping
         * a new bank's file into assets/logos/ still needs no code change.
         */
        function vendorArt(id) {
            if (!id) return null;
            const base = 'assets/logos/' + artSlug(id);
            return { kind: 'brand', srcs: [base + '.webp', base + '.svg', base + '.png'] };
        }

        function deviceArt(vendor, device) {
            if (!device) return null;
            const slug = artSlug(device);
            const srcs = [];
            if (vendor) srcs.push('assets/devices/' + artSlug(vendor) + '-' + slug + '.webp');
            srcs.push('assets/devices/' + slug + '.webp');
            return { kind: 'device', srcs: srcs };
        }

        function artHTML(art, fallbackMark, shape) {
            const kind = shape || (art && art.kind) || 'logo';
            const chipCls = 'gd-card-art gd-art-chip' + (kind === 'device' ? ' gd-art-device-chip' : '');
            const chip = '<span class="' + chipCls + '">' + escapeHTML(fallbackMark || '') + '</span>';
            if (!art || !art.srcs.length) return chip;

            if (art.kind === 'logo') {
                // Masked, so it takes the card's text colour. The mask URL is the
                // first candidate; a CSS mask raises no load event, so the probe
                // in bindArtFallbacks drives the fallback instead.
                return '<span class="gd-card-art gd-art-logo" data-art=\'' + jsonAttr(art.srcs) + '\''
                    + ' style="--art:url(&quot;' + escapeHTML(art.srcs[0]) + '&quot;)"'
                    + ' data-mark="' + escapeHTML(fallbackMark || '') + '"></span>';
            }

            // Brand marks and device photos are both images on a light tile;
            // only the slot's shape differs.
            const tile = art.kind === 'device' ? 'gd-art-device' : 'gd-art-brand';
            return '<span class="gd-card-art ' + tile + '" data-shape="' + escapeHTML(art.kind) + '">'
                + '<img src="' + escapeHTML(art.srcs[0]) + '" alt="" loading="lazy" decoding="async"'
                + ' data-art=\'' + jsonAttr(art.srcs) + '\' data-i="0"'
                + ' data-mark="' + escapeHTML(fallbackMark || '') + '">'
                + '</span>';
        }

        /*
         * Walk the candidate list on failure, and fall back to the lettered chip
         * once every candidate is exhausted. Bound by the list length, so a
         * missing file can never loop.
         */
        function bindArtFallbacks(root) {
            root.querySelectorAll('.gd-art-device img[data-art], .gd-art-brand img[data-art]').forEach(img => {
                img.addEventListener('error', () => {
                    const srcs = JSON.parse(img.dataset.art);
                    const next = Number(img.dataset.i) + 1;
                    if (next < srcs.length) {
                        img.dataset.i = String(next);
                        img.src = srcs[next];
                        return;
                    }
                    replaceWithChip(img.closest('.gd-card-art'), img.dataset.mark);
                });
            });

            // A CSS mask gives no load event, so probe the file to decide whether
            // the logo slot can stay.
            root.querySelectorAll('.gd-art-logo[data-art]').forEach(el => {
                const srcs = JSON.parse(el.dataset.art);
                (function probe(i) {
                    if (i >= srcs.length) { replaceWithChip(el, el.dataset.mark); return; }
                    const test = new Image();
                    test.onload = () => { el.style.setProperty('--art', 'url("' + srcs[i] + '")'); };
                    test.onerror = () => probe(i + 1);
                    test.src = srcs[i];
                })(0);
            });
        }

        function replaceWithChip(slot, mark) {
            if (!slot) return;
            const shape = slot.dataset.shape === 'device' ? ' gd-art-device-chip' : '';
            slot.className = 'gd-card-art gd-art-chip' + shape;
            slot.removeAttribute('style');
            slot.textContent = mark || '';
        }

        function deviceCard(device, guideCount) {
            return '<button class="gd-card" type="button" onclick="openDevice(' + jsStr(view.client) + ',' + jsStr(view.vendor) + ',' + jsStr(device) + ')">'
                + artHTML(deviceArt(view.vendor, device), initialsOf(device), 'device')
                + '<span class="gd-card-text"><span class="gd-card-name">' + escapeHTML(device) + '</span>'
                + '<span class="gd-card-sub">' + escapeHTML(countLabel(guideCount, 'guide')) + '</span></span></button>';
        }

        function guideRow(g) {
            return '<button class="gd-row" type="button" onclick="openGuide(' + jsStr(g.slug) + ')">'
                + '<span class="gd-row-text"><span class="gd-row-name">' + escapeHTML(g.title)
                + (g.is_published ? '' : '<span class="gd-unpub">draft</span>') + '</span>'
                + (g.subtitle ? '<span class="gd-row-sub">' + escapeHTML(g.subtitle) + '</span>' : '')
                + '</span>'
                + '<svg class="gd-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>'
                + '</button>';
        }

        function guideHTML(g) {
            if (!g) return emptyHTML('That guide is no longer available.');

            let html = '<div class="gd-doc-head"><h2>' + escapeHTML(g.title) + '</h2>'
                + (g.subtitle ? '<div class="gd-doc-sub">' + escapeHTML(g.subtitle) + '</div>' : '');
            if (!g.is_published) {
                html += '<div class="gd-doc-sub" style="color:var(--warning);font-weight:650">Draft — not visible to technicians</div>';
            }
            html += '<div class="gd-doc-meta">Updated ' + escapeHTML(formatDateTime(g.updated_at)) + '</div>';
            if (isManager) {
                html += '<div class="page-actions" style="margin-top:12px">'
                    + '<button class="btn btn-secondary btn-sm" onclick="openGuideModal(' + jsStr(g.id) + ')">Edit</button></div>';
            }
            html += '</div>';
            // renderMarkdown escapes before parsing, so body_md cannot inject markup.
            html += '<div class="gd-body">' + renderMarkdown(g.body_md) + '</div>';
            return html;
        }

        function emptyHTML(message) {
            return '<div class="empty-state" style="padding:50px 20px">'
                + '<div class="empty-state-icon"><i data-lucide="book-open"></i></div>'
                + '<p style="color:var(--text-secondary);margin:12px 0 0">' + escapeHTML(message) + '</p></div>';
        }

        function countLabel(n, noun) { return n + ' ' + noun + (n === 1 ? '' : 's'); }

        /*
         * Chip text for a client or vendor card. The catalogue id IS the code a
         * technician knows — vendors are stored as three-letter ids (CBA, NAB,
         * WPB, SUN, HJK) and those are what appear on job sheets. Deriving
         * initials from the display name instead produced "WG" for Westpac
         * Group, a code that exists nowhere.
         */
        function catalogueMark(id) {
            const s = String(id || '').trim().toUpperCase();
            return s.length <= 4 ? s : s.slice(0, 3);
        }

        function initialsOf(label) {
            const words = String(label).trim().split(/\s+/);
            if (words.length === 1) return words[0].slice(0, 3).toUpperCase();
            return words.map(w => w[0]).join('').slice(0, 3).toUpperCase();
        }

        // ---- search ---------------------------------------------------------

        function onSearchInput() {
            searchTerm = document.getElementById('gdSearch').value.trim().toLowerCase();
            renderCrumbs();
            renderMain();
            bindArtFallbacks(document.getElementById('gdMain'));
            lucide.createIcons();
        }

        function searchResultsHTML() {
            const hits = visibleGuides().filter(g => {
                const hay = [
                    g.title, g.subtitle, g.device,
                    g.client_id ? clientLabel(g.client_id) : '',
                    g.vendor_id ? vendorLabel(g.vendor_id) : '',
                    markdownToText(g.body_md)
                ].join(' ').toLowerCase();
                return hay.indexOf(searchTerm) !== -1;
            });
            if (!hits.length) return emptyHTML('No guides match that search.');

            return '<div class="gd-results">' + hits.map(g => {
                const path = [
                    g.client_id ? clientLabel(g.client_id) : 'General',
                    g.vendor_id ? vendorLabel(g.vendor_id) : null,
                    g.device
                ].filter(Boolean).join(' › ');
                return '<button class="gd-row" type="button" onclick="openGuide(' + jsStr(g.slug) + ')">'
                    + '<span class="gd-row-text"><span class="gd-row-name">' + escapeHTML(g.title)
                    + (g.is_published ? '' : '<span class="gd-unpub">draft</span>') + '</span>'
                    + '<span class="gd-result-path">' + escapeHTML(path) + '</span></span>'
                    + '<svg class="gd-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>'
                    + '</button>';
            }).join('') + '</div>';
        }

        // ---- sidebar tree ---------------------------------------------------

        function renderSidebarTree() {
            let html = '';

            generalGuides().forEach(g => {
                html += '<button class="gd-leaf' + (view.slug === g.slug ? ' active' : '') + '" type="button" '
                    + 'style="padding-left:16px" onclick="openGuide(' + jsStr(g.slug) + ')">'
                    + escapeHTML(g.title) + '</button>';
            });

            clientsWithGuides().forEach(c => {
                const ck = 'c:' + c;
                // Ancestors of whatever is open stay expanded; everything else
                // remembers whatever the user last did to it.
                const open = treeCollapsed[ck] === undefined ? (view.client === c) : !treeCollapsed[ck];
                html += '<div class="gd-tree-group' + (open ? '' : ' collapsed') + '">'
                    + treeToggle(ck, clientLabel(c), 'lvl-client')
                    + '<div class="gd-tree-body">';

                vendorsOf(c).forEach(v => {
                    const vk = ck + '|v:' + v;
                    const vOpen = treeCollapsed[vk] === undefined ? (view.client === c && view.vendor === v) : !treeCollapsed[vk];
                    html += '<div class="gd-tree-group' + (vOpen ? '' : ' collapsed') + '">'
                        + treeToggle(vk, vendorLabel(v), 'lvl-vendor')
                        + '<div class="gd-tree-body">';

                    devicesOf(c, v).forEach(d => {
                        const dk = vk + '|d:' + d;
                        const dOpen = treeCollapsed[dk] === undefined ? (view.client === c && view.vendor === v && view.device === d) : !treeCollapsed[dk];
                        html += '<div class="gd-tree-group' + (dOpen ? '' : ' collapsed') + '">'
                            + treeToggle(dk, d, 'lvl-device')
                            + '<div class="gd-tree-body">';
                        guidesOf(c, v, d).forEach(g => {
                            html += '<button class="gd-leaf' + (view.slug === g.slug ? ' active' : '') + '" '
                                + 'type="button" onclick="openGuide(' + jsStr(g.slug) + ')">'
                                + escapeHTML(g.title) + '</button>';
                        });
                        html += '</div></div>';
                    });

                    html += '</div></div>';
                });

                html += '</div></div>';
            });

            if (typeof setSidebarAltNav === 'function') setSidebarAltNav(html, 'Return to main menu');
        }

        function treeToggle(key, label, cls) {
            return '<button class="gd-tw ' + cls + '" type="button" onclick="toggleTree(' + jsStr(key) + ')">'
                + '<svg class="gd-caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'
                + escapeHTML(label) + '</button>';
        }

        function toggleTree(key) {
            // undefined means "follow the open guide"; resolve that to a real
            // boolean before flipping, or the first click can appear to do nothing.
            const current = treeCollapsed[key];
            if (current === undefined) {
                const openByPath = key === 'c:' + view.client
                    || key === 'c:' + view.client + '|v:' + view.vendor
                    || key === 'c:' + view.client + '|v:' + view.vendor + '|d:' + view.device;
                treeCollapsed[key] = openByPath;
            } else {
                treeCollapsed[key] = !current;
            }
            renderSidebarTree();
        }

        // ---- inline-attribute helpers ---------------------------------------

        // Safe single-quoted JS string literal for an inline onclick attribute.
        // Order matters: escape for JS first, then for HTML. Escaping only for
        // HTML would be useless here — the parser decodes &#39; back to a quote
        // before the JS is compiled, so the value could close the string.
        function jsStr(value) {
            const js = String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return "'" + escapeHTML(js) + "'";
        }

        // An object literal for a single-quoted onclick attribute. JSON gives us
        // the quoting; escapeHTML then makes it safe inside the attribute.
        function jsonAttr(obj) {
            return escapeHTML(JSON.stringify(obj));
        }

        // ---- editor ---------------------------------------------------------

        function setEditorTab(tab) {
            const editing = tab === 'edit';
            document.getElementById('gdTabEdit').classList.toggle('active', editing);
            document.getElementById('gdTabPreview').classList.toggle('active', !editing);
            document.getElementById('gdBodyInput').style.display = editing ? '' : 'none';
            document.getElementById('gdPreview').style.display = editing ? 'none' : 'block';
            if (!editing) {
                document.getElementById('gdPreview').innerHTML =
                    renderMarkdown(document.getElementById('gdBodyInput').value);
            }
        }

        function slugify(text) {
            return String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '').slice(0, 100);
        }

        // Only auto-fill the slug while creating, and only until it is touched —
        // an existing slug is a URL people may have shared, so it must not drift.
        function onTitleInput() {
            if (editingGuideId) return;
            const slugField = document.getElementById('gdSlugInput');
            if (slugField.dataset.touched === '1') return;
            const parts = [
                document.getElementById('gdClientInput').value,
                document.getElementById('gdVendorInput').value,
                document.getElementById('gdDeviceInput').value,
                document.getElementById('gdTitleInput').value
            ].filter(Boolean).join('-');
            slugField.value = slugify(parts);
        }

        function populateClientSelect(selected) {
            const sel = document.getElementById('gdClientInput');
            const ids = Object.keys(clientNames).sort((a, b) => clientLabel(a).localeCompare(clientLabel(b)));
            sel.innerHTML = '<option value="">General — no client</option>'
                + ids.map(id => '<option value="' + escapeHTML(id) + '"' + (id === selected ? ' selected' : '') + '>'
                    + escapeHTML(clientLabel(id)) + '</option>').join('');
        }

        function populateVendorSelect(selected) {
            const sel = document.getElementById('gdVendorInput');
            const hasClient = !!document.getElementById('gdClientInput').value;
            const ids = Object.keys(vendorNames).sort((a, b) => vendorLabel(a).localeCompare(vendorLabel(b)));
            sel.innerHTML = '<option value="">None</option>'
                + ids.map(id => '<option value="' + escapeHTML(id) + '"' + (id === selected ? ' selected' : '') + '>'
                    + escapeHTML(vendorLabel(id)) + '</option>').join('');
            // A vendor without a client has no branch to render on, and the DB
            // check constraint rejects it — so mirror that in the form.
            sel.disabled = !hasClient;
            if (!hasClient) sel.value = '';
        }

        function populateDeviceField(selected) {
            const input = document.getElementById('gdDeviceInput');
            const client = document.getElementById('gdClientInput').value;
            const vendor = document.getElementById('gdVendorInput').value;
            input.value = selected || '';
            // Same rule one level down: a device belongs to a bank.
            input.disabled = !vendor;
            if (!vendor) input.value = '';

            const known = uniq(guides.filter(g => g.client_id === client && g.vendor_id === vendor && g.device).map(g => g.device));
            document.getElementById('gdDeviceList').innerHTML =
                known.map(d => '<option value="' + escapeHTML(d) + '"></option>').join('');
        }

        function onClientChange() {
            populateVendorSelect(document.getElementById('gdVendorInput').value);
            populateDeviceField(document.getElementById('gdDeviceInput').value);
        }

        function onVendorChange() {
            populateDeviceField(document.getElementById('gdDeviceInput').value);
        }

        function openGuideModal(guideId) {
            if (!isManager) return;
            const g = guideId ? guides.find(x => x.id === guideId) : null;
            editingGuideId = g ? g.id : null;

            document.getElementById('guideModalTitle').textContent = g ? 'Edit guide' : 'New guide';
            document.getElementById('gdTitleInput').value = g ? g.title : '';
            document.getElementById('gdSubtitleInput').value = g && g.subtitle ? g.subtitle : '';
            document.getElementById('gdSlugInput').value = g ? g.slug : '';
            document.getElementById('gdSlugInput').dataset.touched = g ? '1' : '';
            document.getElementById('gdSortInput').value = g ? g.sort_order : 0;
            document.getElementById('gdPublishedInput').checked = g ? g.is_published : true;
            document.getElementById('gdBodyInput').value = g ? g.body_md : '';
            document.getElementById('gdDeleteBtn').style.display = g ? '' : 'none';

            // Creating from inside a device pre-fills where you already are.
            populateClientSelect(g ? g.client_id : (view.client || ''));
            populateVendorSelect(g ? g.vendor_id : (view.vendor || ''));
            populateDeviceField(g ? g.device : (view.device || ''));

            setEditorTab('edit');
            document.getElementById('guideModal').classList.add('active');
            lucide.createIcons();
        }

        function closeGuideModal() {
            document.getElementById('guideModal').classList.remove('active');
            editingGuideId = null;
        }

        document.getElementById('gdSlugInput').addEventListener('input', function () {
            this.dataset.touched = '1';
        });

        document.getElementById('guideForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isManager) return;

            const title = document.getElementById('gdTitleInput').value.trim();
            const slug = document.getElementById('gdSlugInput').value.trim().toLowerCase();
            const clientId = document.getElementById('gdClientInput').value || null;
            const vendorId = document.getElementById('gdVendorInput').value || null;
            const device = document.getElementById('gdDeviceInput').value.trim() || null;

            if (!title) { showAlert('A guide needs a title.', 'warning'); return; }
            if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
                showAlert('The slug must be lowercase letters, numbers and hyphens.', 'warning');
                return;
            }
            if (vendorId && !clientId) {
                showAlert('Pick a client before a vendor.', 'warning'); return;
            }
            if (device && !vendorId) {
                showAlert('Pick a vendor before a device.', 'warning'); return;
            }

            const payload = {
                slug: slug,
                client_id: clientId,
                vendor_id: vendorId,
                device: device,
                title: title,
                subtitle: document.getElementById('gdSubtitleInput').value.trim() || null,
                body_md: document.getElementById('gdBodyInput').value,
                sort_order: parseInt(document.getElementById('gdSortInput').value, 10) || 0,
                is_published: document.getElementById('gdPublishedInput').checked,
                updated_by: currentUser.id
            };

            showLoading(true);
            try {
                if (editingGuideId) {
                    const { error } = await db.from('guides').update(payload).eq('id', editingGuideId);
                    if (error) throw error;
                } else {
                    const { error } = await db.from('guides').insert([payload]);
                    if (error) throw error;
                }
                const wasEditing = editingGuideId;
                closeGuideModal();
                await loadGuides();
                openGuide(slug);
                showAlert(wasEditing ? 'Guide updated' : 'Guide created', 'success');
            } catch (error) {
                console.error('Guide save failed:', error);
                if (isUniqueViolation(error)) {
                    showAlert('That slug is already used by another guide.', 'error');
                } else {
                    showAlert('Could not save the guide. Please try again.', 'error');
                }
            } finally {
                showLoading(false);
            }
        });

        function deleteGuideFromModal() {
            const id = editingGuideId;
            if (!id) return;
            const g = guides.find(x => x.id === id);
            if (!g) return;
            if (!confirm('Delete "' + g.title + '"?')) return;
            closeGuideModal();
            deleteGuide(id);
        }

        async function deleteGuide(id) {
            const g = guides.find(x => x.id === id);
            showLoading(true);
            try {
                const { error } = await db.from('guides').delete().eq('id', id);
                if (error) throw error;
                await loadGuides();
                // Step back to the device the guide lived under, which may itself
                // now be gone.
                go(g ? { client: g.client_id, vendor: g.vendor_id, device: g.device } : {});
                showAlert('Guide deleted', 'success');
            } catch (error) {
                console.error('Guide delete failed:', error);
                showAlert('Could not delete the guide.', 'error');
            } finally {
                showLoading(false);
            }
        }

        // A body may still carry a ?guide= link even though nothing seeded does.
        document.addEventListener('click', (e) => {
            const link = e.target.closest && e.target.closest('a.gd-xref');
            if (!link) return;
            const slug = (link.getAttribute('href') || '').replace('?guide=', '');
            if (!guideIndex[slug]) return;
            e.preventDefault();
            openGuide(slug);
        });

        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'guideModal') closeGuideModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeGuideModal();
        });
    </script>
</body>
</html>
