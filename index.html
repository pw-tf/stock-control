<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Stock Submission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <script>(function(){var t=localStorage.getItem("theme")||"ocean";var m=localStorage.getItem("mode")||"dark";document.documentElement.setAttribute("data-theme",t);document.documentElement.setAttribute("data-mode",m);})();</script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <script src="icons.js"></script>
    <script src="auth.js"></script>
    <script src="utils.js"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo"><i data-lucide="package" width="32" height="32"></i></div>
                <h1>Stock Submission</h1>
                <p>Sign in to manage your inventory</p>
            </div>
            
            <div class="login-content">
                <div id="alertContainer"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            required 
                            autocomplete="email" 
                            placeholder="you@company.com"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            required 
                            autocomplete="current-password" 
                            placeholder="Enter your password"
                        >
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%; margin-top: 8px;">
                        <span id="loginText">Sign In</span>
                        <div class="spinner loading-spinner-inline" id="loginSpinner" style="display: none;"></div>
                    </button>
                </form>
                
                <div class="login-footer">
                    <a href="forgot-password.html">Forgot your password?</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is already logged in — route by role, same as a fresh login
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                const { data } = await db.from('user_roles').select('role')
                    .eq('user_id', session.user.id).maybeSingle();
                window.location.href = (data && data.role === 'merchant') ? 'guides.html' : 'home.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            
            // Show loading state
            loginBtn.disabled = true;
            loginText.style.display = 'none';
            loginSpinner.style.display = 'block';
            
            try {
                // Sign in with Supabase Auth
                const { data: authData, error: authError } = await db.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (authError) throw authError;
                
                // Get user role
                const { data: roleData, error: roleError } = await db
                    .from('user_roles')
                    .select('role, agent_id, must_change_password')
                    .eq('user_id', authData.user.id)
                    .single();

                if (roleError) {
                    // Account exists but signup was incomplete
                    await db.auth.signOut();
                    const err = new Error('Account setup incomplete. Please contact your administrator.');
                    err.friendly = true; // safe to show as-is
                    throw err;
                }

                // Force password change on first login
                if (roleData.must_change_password) {
                    window.location.href = 'change-password.html';
                    return;
                }

                showAlert('Login successful! Redirecting...', 'success');

                // Redirect based on role
                setTimeout(() => {
                    if (roleData.role === 'merchant') {
                        window.location.href = 'guides.html';
                    } else {
                        window.location.href = 'home.html';
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                showAlert(error.friendly ? error.message : 'Invalid email or password', 'error');
                
                // Reset button state
                loginBtn.disabled = false;
                loginText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        });

    </script>
</body>
</html>
