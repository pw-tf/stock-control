<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="utils.js"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>Forgot Password</h1>
                <p>Enter your email and we'll send you a reset link</p>
            </div>

            <div class="login-content">
                <div id="alertContainer"></div>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            required
                            autocomplete="email"
                            placeholder="you@company.com"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; margin-top: 8px;">
                        <span id="submitText">Send Reset Link</span>
                        <div class="spinner loading-spinner-inline" id="submitSpinner" style="display: none;"></div>
                    </button>
                </form>

                <div class="login-footer">
                    <a href="index.html">Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient(
            "https://lfydtctndrzzdyavmlva.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmeWR0Y3RuZHJ6emR5YXZtbHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0Nzc5MTksImV4cCI6MjA4MzA1MzkxOX0.O7dL6Gl-Re1yKEixO_BRa-goj67os6riy15hRIE4nqY"
        );

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');

            submitBtn.disabled = true;
            submitText.style.display = 'none';
            submitSpinner.style.display = 'block';

            try {
                const { error } = await db.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });

                if (error) throw error;

                showAlert('If an account exists with this email, a reset link has been sent. Check your inbox.', 'success');

                // Disable form after success
                document.getElementById('forgotPasswordForm').style.display = 'none';
            } catch (error) {
                console.error('Password reset error:', error);
                showAlert('Error: ' + error.message, 'error');

                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
